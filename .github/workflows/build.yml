# Adds `mo sessions` to each official Mole (tw93/Mole) release and publishes the
# patched source as a GitHub Release of this repo. Unofficial; per the Mole
# trademark policy this fork does not use the Mole name for itself. Runs every 6 hours and does nothing
# unless tw93/Mole has released a version this repo hasn't built yet. A push
# that changes the overlay or the scripts rebuilds the current version.
name: Build with agent sessions

on:
  schedule:
    - cron: "41 */6 * * *"
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Mole version to build, e.g. V1.74.0 (empty: the latest official release)"
        required: false
        default: ""
      force:
        description: "Rebuild even if this repo already has that release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-agent-sessions-overlay
  cancel-in-progress: false

env:
  UPSTREAM: tw93/Mole

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick the version to build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          [[ -z "$version" || "$version" == V* ]] || version="V${version#v}"
          if [ -z "$version" ]; then
            # releases/latest is always the macOS CLI; Windows/Linux CLI
            # releases (V*-windows, V*-linux) are never marked latest.
            version=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name) || version=
          fi
          if [ -z "$version" ]; then
            echo "GitHub API unreachable; using the newest plain V<x.y.z> tag."
            version=$(git ls-remote --tags --refs "https://github.com/$UPSTREAM" 'V*' \
              | sed -n 's|.*refs/tags/\(V[0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -1)
          fi
          [[ "$version" =~ ^V[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$version'"; exit 1; }
          git ls-remote --exit-code --tags "https://github.com/$UPSTREAM" "refs/tags/$version" >/dev/null \
            || { echo "::error::$UPSTREAM has no tag $version"; exit 1; }
          build=true
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != true ]; then
            build=false
            echo "$version is already built."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.version }}
          path: mole
          persist-credentials: false
      # This repo's overlay and scripts, beside the upstream source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci
          persist-credentials: false

      - name: Check the upstream version
        run: |
          set -euo pipefail
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' mole/mole | head -1)
          [ "V$v" = "$VERSION" ] || { echo "::error::tag $VERSION but mole says VERSION=$v"; exit 1; }

      - name: Add mo sessions
        run: python3 -I .ci/scripts/apply_overlay.py "$GITHUB_WORKSPACE/mole"

      - name: Lint
        working-directory: mole
        run: |
          set -euo pipefail
          find bin lib -name '*.sh' -print0 | xargs -0 -n1 /bin/bash -n
          /bin/bash -n mole
          bin/completion.sh zsh | zsh -n /dev/stdin
          bin/completion.sh bash | /bin/bash -n
          # Mole's own gate: raw recursive deletes need a # SAFE: reason.
          python3 -I scripts/audit_destructive_sinks.py
          # Advisory only: ShellCheck findings never block a release.
          if command -v shellcheck >/dev/null || brew install shellcheck >/dev/null 2>&1; then
            shellcheck -S warning -x bin/sessions.sh | sed 's/^/::warning::/' || true
          fi

      - name: Smoke test (macOS bash 3.2, fake sessions in a temp HOME)
        run: /bin/bash .ci/scripts/smoke_test.sh mole

      - name: Package
        run: |
          set -euo pipefail
          name="agent-sessions-overlay-$VERSION"
          mkdir -p dist
          rsync -a --exclude .git mole/ "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-sessions-overlay
          path: |
            dist/agent-sessions-overlay-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-sessions-overlay
          path: dist
      - name: Publish the release
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --yes --cleanup-tag
          fi
          gh release create "$VERSION" "dist/agent-sessions-overlay-$VERSION.tar.gz" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --latest \
            --title "$VERSION with agent sessions (unofficial)" \
            --notes "Source of [$UPSTREAM $VERSION](https://github.com/$UPSTREAM/releases/tag/$VERSION) (GPL-3.0) with \`mo sessions\` added by this repo's overlay ([$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA)); the changes are listed in SESSIONS-OVERLAY.md inside the archive. Unofficial and not affiliated with or endorsed by the Mole project. Install or update with \`update-mole.sh\` from this repo."
      # A commit per release keeps the repo "active", so GitHub doesn't
      # switch the schedule off after 60 quiet days.
      - name: Record the built version
        run: |
          set -euo pipefail
          echo "$VERSION" > LATEST
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST
          git diff --cached --quiet || { git commit -m "Built $VERSION with agent sessions"; git push; }
